<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zudoku | Sindicato Enigma</title>
<link rel="stylesheet" href="../assets/zudoku/zudoku.css">
</head>
<body>
<main id="game">
<header class="topbar">
<div class="stat"><span>TIEMPO</span><strong id="timer">00:00</strong></div>
<div class="stat"><span>ERRORES</span><strong id="errors">0</strong></div>
<div class="stat"><span>PISTAS</span><strong id="hints">0/3</strong></div>
</header>
<section id="board" aria-label="Tablero de Zudoku"></section>
<section class="controls">
<div id="numberPad" class="number-pad"></div>
<div class="utility-row">
<button id="notesBtn" class="utility">NOTAS</button>
<button id="deleteBtn" class="utility">BORRAR</button>
<button id="hintBtn" class="utility">PISTA</button>
</div>
</section>
<div id="message" class="message"></div>
</main>

<section id="finishScreen" class="finish-screen hidden">
<div class="finish-card">
<h1>¡ZUDOKU COMPLETADO!</h1>
<p id="finalMessage">Has resuelto el expediente.</p>
<div class="final-stats">
<p>Tiempo: <strong id="finalTime">00:00</strong></p>
<p>Errores: <strong id="finalErrors">0</strong></p>
<p>Pistas usadas: <strong id="finalHints">0/3</strong></p>
</div>
<button id="restartBtn" class="restart">JUGAR DE NUEVO</button>
<button id="menuBtn" class="restart secondary">SALIR</button>
</div>
</section>
<script src="../assets/zudoku/zudoku.js"></script>
</body>
</html>
